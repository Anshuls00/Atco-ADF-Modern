name: Modern ADF Pipeline
on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: "AnshulSinha-rg"  
  DEV_ADF_NAME: "atcopoc-devadf"          
  PROD_ADF_NAME: "atcopoc-prodadf"      
  AZURE_LOCATION: "East US"               

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      template-name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Install packages
        run: |
          npm install @microsoft/azure-data-factory-utilities@1.0.0
        
      - name: Validate ADF
        run: |
          npm run build validate ${{ github.workspace }} /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.AZURE_RESOURCE_GROUP }}/providers/Microsoft.DataFactory/factories/${{ env.DEV_ADF_NAME }}
          
      - name: Generate Templates
        run: |
          npm run build export ${{ github.workspace }} /subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ env.AZURE_RESOURCE_GROUP }}/providers/Microsoft.DataFactory/factories/${{ env.DEV_ADF_NAME }} "Templates"
          
      - name: Upload Templates
        uses: actions/upload-artifact@v4
        with:
          name: ARM-Templates-${{ github.run_number }}
          path: ${{ github.workspace }}/Templates/
          
      - name: Set output
        id: artifact
        run: echo "name=ARM-Templates-${{ github.run_number }}" >> $GITHUB_OUTPUT

  deploy-prod:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Download Templates
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.template-name }}
          
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Set Azure Subscription
        run: |
          az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"
          
      - name: List Downloaded Files (Debug)
        run: |
          echo "Downloaded files:"
          ls -la
          echo "Current directory: $(pwd)"
          
      - name: Deploy ARM Template
        run: |
          echo "Deploying to Production ADF..."
          az deployment group create \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --template-file ARMTemplateForFactory.json \
            --parameters @ARMTemplateParametersForFactory.json \
            --parameters factoryName=${{ env.PROD_ADF_NAME }} \
            --mode Incremental \
            --verbose
          
          echo "Deployment completed successfully!"
